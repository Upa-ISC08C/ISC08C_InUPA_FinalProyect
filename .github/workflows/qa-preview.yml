name: QA Preview (Runner Windows)

# Levanta el entorno del PR en la maquina Windows (self-hosted runner) con Docker,
# para la revision visual (QA). Se activa cuando el PR recibe la etiqueta "qa".
#
# REQUISITO: self-hosted runner con labels [self-hosted, windows] y Docker Desktop corriendo.
# Los valores sensibles se toman de un archivo LOCAL del runner (C:\actions-runner\inupa.env),
# porque docker/.env NO esta versionado ni se guarda como secret en GitHub.
#
# SEGURIDAD: un self-hosted runner ejecuta el codigo del PR en tu maquina. Usa esto solo
# con PRs del propio equipo, nunca con forks externos no confiables.

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
    branches: [develop, qa]

concurrency:
  group: qa-preview
  cancel-in-progress: false

jobs:
  levantar:
    name: Levantar entorno de QA
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.action != 'unlabeled' &&
      contains(github.event.pull_request.labels.*.name, 'qa')
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Generar el .env (desde el archivo local del runner)
        # OJO: docker-compose.yml declara 'env_file: ../.env', que se resuelve
        # relativo a docker/, es decir la RAIZ del repo. Copiarlo a docker/.env
        # hacia que compose abortara con "env file not found".
        run: |
          Copy-Item "C:\actions-runner\inupa.env" "$env:GITHUB_WORKSPACE\.env" -Force
      - name: Bajar entorno previo (si existe)
        run: docker compose -p inupa-qa -f docker/docker-compose.yml -f docker/docker-compose.qa.yml down -v
        continue-on-error: true
      - name: Construir y levantar
        run: docker compose -p inupa-qa -f docker/docker-compose.yml -f docker/docker-compose.qa.yml up -d --build
      - name: Publicar URLs de QA
        run: |
          "### Entorno de QA levantado en el Runner de Windows" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Frontend: http://localhost:5273" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "- Backend: http://localhost:3100/api" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Puertos propios: la preview NO toca el entorno local (5173/3000)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Quita la etiqueta 'qa' o cierra el PR para bajar el entorno." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  bajar:
    name: Bajar entorno de QA
    # Solo si el PR realmente estaba en QA: al cerrar uno que tenia la etiqueta,
    # o al quitarle justamente la etiqueta 'qa'. Antes, cerrar CUALQUIER PR
    # tumbaba el entorno de QA de otro PR que si lo estaba usando.
    if: >-
      (github.event.action == 'closed' &&
       contains(github.event.pull_request.labels.*.name, 'qa')) ||
      (github.event.action == 'unlabeled' && github.event.label.name == 'qa')
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Generar el .env (desde el archivo local del runner)
        # OJO: docker-compose.yml declara 'env_file: ../.env', que se resuelve
        # relativo a docker/, es decir la RAIZ del repo. Copiarlo a docker/.env
        # hacia que compose abortara con "env file not found".
        run: |
          Copy-Item "C:\actions-runner\inupa.env" "$env:GITHUB_WORKSPACE\.env" -Force
      - name: Bajar entorno
        run: docker compose -f docker/docker-compose.yml down -v
        continue-on-error: true
