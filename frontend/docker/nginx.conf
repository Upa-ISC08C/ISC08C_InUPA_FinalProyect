server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los CV con foto y las imagenes de vacantes viajan como data URI y pueden
    # pesar bastante; el limite por defecto (1 MB) los rechazaria.
    client_max_body_size 25m;

    # El API se sirve por el mismo origen: asi el navegador no necesita CORS y el
    # bundle no depende de en que host o puerto quedo el backend. Se construye
    # con VITE_API_URL=/api para que apunte aqui.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soporte para React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
