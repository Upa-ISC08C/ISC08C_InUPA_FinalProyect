# Punto de entrada del entorno de desarrollo. Sigue funcionando igual que antes:
#
#   docker compose -f docker/docker-compose.yml up -d
#
# La diferencia es que cada servicio vive en su propio archivo y aqui solo se
# combinan. Asi se puede leer (o levantar) un servicio por separado sin tener
# que entender el resto:
#
#   compose.db.yml        base de datos + servidor de correo de pruebas
#   compose.backend.yml   API de Node/Express
#   compose.frontend.yml  interfaz de React
#
# Ejemplos de uso parcial:
#   docker compose -f docker/compose.db.yml up -d                 (solo la BD)
#   docker compose -f docker/compose.db.yml -f docker/compose.backend.yml up -d
#
# Los valores sensibles NO van aqui: viven en el .env de la raiz (no versionado).
# Ejecuta 'node scripts/setup-env.js' para generarlo desde docker/.env.example.

include:
  - compose.db.yml
  - compose.backend.yml
  - compose.frontend.yml

# En WSL2 el enlace de la VM usa MTU 1280; sin esto los contenedores heredan
# 1500 y las conexiones HTTPS salientes (p.ej. la IA de OpenRouter) se cuelgan
# porque los paquetes grandes del handshake TLS superan el MTU y se descartan.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1280"
